# Detekt static analysis configuration for ARH-Terminal
# Tuned for modern Kotlin, Jetpack Compose, and deep SSH/tmux protocol state machines.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)'
  MatchingDeclarationName:
    active: false

complexity:
  LongMethod:
    threshold: 350
  LongParameterList:
    functionThreshold: 15
    constructorThreshold: 15
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 45
  LargeClass:
    threshold: 3000
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 6

style:
  ThrowsCount:
    max: 16
  ReturnCount:
    max: 8
  LoopWithTooManyJumpStatements:
    maxJumpCount: 5
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 220
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false

potential-bugs:
  UnreachableCode:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true

exceptions:
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
