appId: com.arh.terminal
tags:
  - overflow
  - typography
---
- launchApp:
    clearState: false

# 1. Font scale is set to 200% by the CI emulator script.

# 2. Assert Layout Does Not Break or Clip Key Labels
- assertVisible:
    id: "app_title"
- assertVisible: "Connect (psmux -CC)"
- assertVisible: "Android MCP Agent Bridge"

# 3. Test Landscape Density & Screen Real Estate
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: "input_host"
- assertVisible:
    id: "btn_connect"

# 4. Restore Standard Dimensions
- setOrientation: PORTRAIT
